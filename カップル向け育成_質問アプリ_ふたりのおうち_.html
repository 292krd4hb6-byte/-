    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // MODULE 1: CONFIG & APP_VERSION（今後のアップデートはここを中心に拡張）
        // =========================================================================
        const APP_CONFIG = {
            version: "v1.2.0",
            schemaVersion: 2,
            defaultTheme: "cream",
            themes: [
                { id: "cream", name: "ウォームクリーム", swatch: "#F4A28C", icon: "☕️" },
                { id: "sakura", name: "さくらピンク", swatch: "#F497B6", icon: "🌸" },
                { id: "mint", name: "ミントパステル", swatch: "#74C69D", icon: "🌿" },
                { id: "lavender", name: "ラベンダーナイト", swatch: "#B39DDB", icon: "🌙" }
            ],
            changelog: [
                {
                    ver: "v1.2.0",
                    date: "最新",
                    notes: "お部屋の着せ替えテーマ4種・思い出アルバム・アップデート履歴・自動データ互換保護を追加！"
                },
                {
                    ver: "v1.1.0",
                    date: "前回",
                    notes: "ルーム名＆あいことばでのリアルタイム共有・カレンダーさかのぼり機能を追加"
                },
                {
                    ver: "v1.0.0",
                    date: "初期版",
                    notes: "ペット育成・毎日の質問ロック解除・気分＆ミニメモ機能リリース"
                }
            ]
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'futari-no-ouchi-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        // =========================================================================
        // MODULE 2: QUESTIONS_BANK & MASTER DATA（質問の追加もここへ）
        // =========================================================================
        const QUESTIONS_BANK = [
            "二人で一番思い出に残っているデートはどこ？理由も教えて！",
            "相手の「ここが大好き！」と思うところを3つ教えて！",
            "これから二人で一緒に挑戦してみたいことや行きたい場所は？",
            "初めて会ったときの第一印象と、今の印象はどう変わった？",
            "疲れたときに相手にしてもらえると一番嬉しいことは？",
            "もし二人で1日だけ魔法が使えるとしたら、何をして過ごす？",
            "相手のスマホに保存されている写真で、一番お気に入りの一枚は？",
            "一緒に食べて一番美味しかったご飯やスイーツは何？",
            "相手の「ちょっと可愛いな・愛おしいな」と思う仕草やクセは？",
            "10年後の二人はどんなふうに過ごしていると思う？",
            "おうちデートをするなら、何を観て何を食べたい？",
            "最近、相手に「ありがとう」と伝えたい小さな出来事はある？",
            "二人で季節のイベント（花火・紅葉・クリスマスなど）に行くならどこ？",
            "相手を動物にたとえるとしたら何？その理由も教えて！",
            "朝起きたとき、一番最初に相手にかけてほしい言葉は？",
            "二人だけの「お決まりのルール」や「合言葉」を作るなら何にする？",
            "これまでプレゼントされたり、もらって一番嬉しかったものは？",
            "休日の朝、二人で理想のモーニングを過ごすならどんなメニュー？"
        ];

        const MOOD_OPTIONS = [
            { emoji: "😊", text: "ハッピー" },
            { emoji: "🥰", text: "会いたい" },
            { emoji: "😪", text: "眠い" },
            { emoji: "✨", text: "わくわく" },
            { emoji: "🥺", text: "甘えたい" },
            { emoji: "🍽️", text: "おなかすいた" }
        ];

        // =========================================================================
        // MODULE 3: STATE_STORE & AUTO-MIGRATION（既存データの安全な補完）
        // =========================================================================
        const STATE_STORE = {
            currentRoomId: "",
            currentRoomPasswordPlain: "",
            myRole: "A",
            roomData: null,
            selectedDateStr: getTodayStr(),
            calViewYear: new Date().getFullYear(),
            calViewMonth: new Date().getMonth(),
            activeMoodTarget: "me"
        };

        // 古いバージョンのルームデータでもエラーが出ないよう安全な初期値を補完
        function normalizeRoomData(raw = {}) {
            const todayStr = getTodayStr();
            return {
                roomId: raw.roomId || STATE_STORE.currentRoomId,
                passwordHash: raw.passwordHash || "",
                schemaVersion: raw.schemaVersion || APP_CONFIG.schemaVersion,
                theme: raw.theme || APP_CONFIG.defaultTheme,
                nameA: raw.nameA || "ゆうき",
                nameB: raw.nameB || "あおい",
                startDate: raw.startDate || todayStr,
                petName: raw.petName || "もちまる",
                affection: typeof raw.affection === "number" ? raw.affection : 20,
                level: typeof raw.level === "number" ? raw.level : 1,
                moodA: raw.moodA || { emoji: "🥰", text: "会いたい" },
                moodB: raw.moodB || { emoji: "😊", text: "ハッピー" },
                memos: Array.isArray(raw.memos) ? raw.memos : [],
                entries: raw.entries && typeof raw.entries === "object" ? raw.entries : {}
            };
        }

        function getTodayStr() {
            return formatDateYMD(new Date());
        }

        function formatDateYMD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatJapaneseDate(ymd) {
            const [y, m, d] = ymd.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const weeks = ['日', '月', '火', '水', '木', '金', '土'];
            return `${y}年${m}月${d}日 (${weeks[dateObj.getDay()]})`;
        }

        function getQuestionForDate(ymd) {
            let hash = 0;
            for (let i = 0; i < ymd.length; i++) {
                hash = (hash * 31 + ymd.charCodeAt(i)) >>> 0;
            }
            return QUESTIONS_BANK[hash % QUESTIONS_BANK.length];
        }

        async function hashPassword(pw) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pw + "_futari_salt");
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // =========================================================================
        // MODULE 4: FIREBASE_SERVICE（認証・Firestore同期層）
        // =========================================================================
        const FIREBASE_SERVICE = {
            db: null,
            auth: null,
            currentUser: null,
            unsubscribeRoom: null,

            async ensureAuth() {
                if (!firebaseConfig) throw new Error("Firebase設定が見つかりません。");
                if (!this.db) {
                    const app = initializeApp(firebaseConfig);
                    this.db = getFirestore(app);
                    this.auth = getAuth(app);
                }
                if (!this.currentUser) {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const cred = await signInWithCustomToken(this.auth, __initial_auth_token);
                        this.currentUser = cred.user;
                    } else {
                        const cred = await signInAnonymously(this.auth);
                        this.currentUser = cred.user;
                    }
                }
                return this.currentUser;
            },

            getRoomRef(roomId) {
                return doc(this.db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            },

            subscribe(roomId, onUpdate) {
                if (this.unsubscribeRoom) this.unsubscribeRoom();
                if (!this.currentUser) return;

                const roomRef = this.getRoomRef(roomId);
                this.unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        STATE_STORE.roomData = normalizeRoomData(docSnap.data());
                        onUpdate(STATE_STORE.roomData);
                    }
                }, (error) => {
                    console.error("Realtime sync error:", error);
                    showToast("同期エラーが発生しました");
                });
            },

            async patchRoom(patchObj) {
                if (!this.currentUser || !STATE_STORE.currentRoomId || !this.db) return;
                try {
                    await updateDoc(this.getRoomRef(STATE_STORE.currentRoomId), patchObj);
                } catch (e) {
                    console.error("Failed to update room:", e);
                    showToast("保存に失敗しました");
                }
            }
        };

        function renderCalendarTab() {
            const y = STATE_STORE.calViewYear;
            const m = STATE_STORE.calViewMonth;
            document.getElementById('cal-month-title').textContent = `${y}年 ${m + 1}月`;

            const grid = document.getElementById('calendar-grid');
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const todayStr = getTodayStr();
            const entries = STATE_STORE.roomData.entries;
            const annivMD = STATE_STORE.roomData.startDate.slice(5);

            let cellsHtml = "";
            for (let i = 0; i < firstDay; i++) {
                cellsHtml += `<div class="h-12"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const mStr = String(m + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const cellDateStr = `${y}-${mStr}-${dStr}`;
                const isFuture = cellDateStr > todayStr;
                const isSelected = cellDateStr === STATE_STORE.selectedDateStr;
                const isToday = cellDateStr === todayStr;
                const isAnniv = (`${mStr}-${dStr}` === annivMD);

                const entry = entries[cellDateStr] || {};
                const hasA = Boolean(entry.answerA);
                const hasB = Boolean(entry.answerB);

                let stamp = "";
                if (hasA && hasB) stamp = "💖";
                else if (hasA || hasB) stamp = "⭐";
                else if (isAnniv) stamp = "🎂";

                let cellStyle = "bg-latte/40 text-choco hover:bg-peach/40";
                if (isFuture) cellStyle = "bg-transparent text-choco-light/30 pointer-events-none";
                else if (isSelected) cellStyle = "bg-accent text-white shadow-sm scale-105";
                else if (isToday) cellStyle = "bg-peach/60 text-choco border border-peach-dark";

                cellsHtml += `
                    <button onclick="selectCalendarDate('${cellDateStr}')" class="h-12 rounded-2xl flex flex-col items-center justify-center transition relative ${cellStyle}">
                        <span class="text-xs font-bold leading-none">${day}</span>
                        <span class="text-[11px] leading-none mt-1 h-3">${stamp}</span>
                    </button>
                `;
            }

            grid.innerHTML = cellsHtml;
            renderCalendarSelectedDetail();
        }

        window.selectLoginRole = function(role) {

        };

        window.handleEnterRoom = async function() {
            const rawRoomId = document.getElementById('login-room-id').value.trim().toLowerCase();
            const rawPassword = document.getElementById('login-password').value.trim();

            if (!rawRoomId || !rawPassword) {
                showToast("ルーム名とあいことばを両方入力してね！");
                return;
            }
            if (!/^[a-z0-9_-]+$/.test(rawRoomId)) {
                showToast("ルーム名は半角英数字・ハイフン・アンダースコアで入力してね！");
                return;
            }

            const btn = document.getElementById('login-submit-btn');
            btn.disabled = true;
            btn.textContent = "お部屋を準備中...";

            try {
                const user = await FIREBASE_SERVICE.ensureAuth();
                if (!user) return;

                const pwHash = await hashPassword(rawPassword);
                const roomRef = FIREBASE_SERVICE.getRoomRef(rawRoomId);
                const snap = await getDoc(roomRef);

                if (snap.exists()) {
                    const existing = snap.data();
                    if (existing.passwordHash !== pwHash) {
                        showToast("あいことば（パスワード）が違うみたい…🔑");
                        return;
                    }
                    showToast(`おかえりなさい！「${rawRoomId}」に入室しました💕`);
                } else {
                    const initialRoom = normalizeRoomData({
                        roomId: rawRoomId,
                        passwordHash: pwHash,
                        memos: [
                            {
                                id: Date.now(),
                                authorRole: "A",
                                text: "ふたりのおうちへようこそ！これからたくさん思い出作ろうね🐣💕",
                                color: "bg-[#FFF3CD]"
                            }
                        ]
                    });
                    await setDoc(roomRef, initialRoom);
                    showToast(`新しいお部屋「${rawRoomId}」をつくったよ🎉`);
                }

                STATE_STORE.currentRoomId = rawRoomId;
                STATE_STORE.currentRoomPasswordPlain = rawPassword;
                FIREBASE_SERVICE.subscribe(rawRoomId, renderAll);

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-shell').classList.remove('hidden');
            } catch (err) {
                console.error(err);
                showToast("接続エラーが発生しました。もう一度試してね。");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🚪</span> お部屋に入る / 新しくつくる';
            }
        };

        window.handleLogout = function() {
            if (FIREBASE_SERVICE.unsubscribeRoom) {
                FIREBASE_SERVICE.unsubscribeRoom();
                FIREBASE_SERVICE.unsubscribeRoom = null;
            }
            STATE_STORE.roomData = null;
            STATE_STORE.currentRoomId = "";
            STATE_STORE.currentRoomPasswordPlain = "";
            applyTheme(APP_CONFIG.defaultTheme);
            document.getElementById('login-password').value = "";
            document.getElementById('app-shell').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            switchTab('home');
            showToast("お部屋から退室しました");
        };

        window.changeRoomTheme = async function(themeId) {
            applyTheme(themeId);
            await FIREBASE_SERVICE.patchRoom({ theme: themeId });
            const found = APP_CONFIG.themes.find(t => t.id === themeId);
            showToast(`お部屋のテーマを「${found?.name || themeId}」に変更したよ🎨`);
        };

        window.saveMyAnswerForSelectedDate = async function() {
            const text = document.getElementById('answer-me').value.trim();
            if (!text) {
                showToast("回答を入力してから保存してね！");
                return;
            }

            const selStr = STATE_STORE.selectedDateStr;
            const prevEntry = STATE_STORE.roomData.entries[selStr] || {};
            const isFirstTimeMyAnswer = !(STATE_STORE.myRole === 'A' ? prevEntry.answerA : prevEntry.answerB);

            const fieldPath = `entries.${selStr}.${STATE_STORE.myRole === 'A' ? 'answerA' : 'answerB'}`;
            const updates = { [fieldPath]: text };

            if (isFirstTimeMyAnswer) {
                let newAffection = STATE_STORE.roomData.affection + 20;
                let newLevel = STATE_STORE.roomData.level;
                if (newAffection >= 100) {
                    newAffection -= 100;
                    newLevel += 1;
                    showToast(`🎉 おめでとう！${STATE_STORE.roomData.petName}が Lv.${newLevel} に成長したよ！`);
                } else {
                    showToast("回答を保存したよ！なかよし度 +20 💕");
                }
                updates.affection = newAffection;
                updates.level = newLevel;
            } else {
                showToast("回答を更新しました✨");
            }

            await FIREBASE_SERVICE.patchRoom(updates);
        };

        window.openQuestionForDate = function(ymd) {
            STATE_STORE.selectedDateStr = ymd;
            switchTab('question');
            renderQuestionTab();
        };

        window.shiftSelectedDate = function(deltaDays) {
            const [y, m, d] = STATE_STORE.selectedDateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d + deltaDays);
            const nextStr = formatDateYMD(dt);
            if (nextStr > getTodayStr()) return;
            STATE_STORE.selectedDateStr = nextStr;
            renderQuestionTab();
        };

        window.selectCalendarDate = function(ymd) {
            STATE_STORE.selectedDateStr = ymd;
            renderCalendarTab();
        };

        window.changeCalendarMonth = function(delta) {
            STATE_STORE.calViewMonth += delta;
            if (STATE_STORE.calViewMonth < 0) {
                STATE_STORE.calViewMonth = 11;
                STATE_STORE.calViewYear -= 1;
            } else if (STATE_STORE.calViewMonth > 11) {
                STATE_STORE.calViewMonth = 0;
                STATE_STORE.calViewYear += 1;
            }
            renderCalendarTab();
        };

        window.jumpCalendarToToday = function() {
            const now = new Date();
            STATE_STORE.calViewYear = now.getFullYear();
            STATE_STORE.calViewMonth = now.getMonth();
            STATE_STORE.selectedDateStr = formatDateYMD(now);
            renderCalendarTab();
        };

        window.switchMyRole = function(role) {
            STATE_STORE.myRole = role;
            renderAll();
            showToast(`パートナー ${role} に切り替えました`);
        };

        window.saveSettings = async function() {
            const newMyName = document.getElementById('setting-name-me').value.trim() || getMyName();
            const newPartnerName = document.getElementById('setting-name-partner').value.trim() || getPartnerName();
            const newStartDate = document.getElementById('setting-start-date').value || STATE_STORE.roomData.startDate;
            const newPetName = document.getElementById('setting-pet-name').value.trim() || "もちまる";
            const newPw = document.getElementById('setting-new-password').value.trim();

            const updates = {
                nameA: STATE_STORE.myRole === 'A' ? newMyName : newPartnerName,
                nameB: STATE_STORE.myRole === 'A' ? newPartnerName : newMyName,
                startDate: newStartDate,
                petName: newPetName
            };

            if (newPw) {
                updates.passwordHash = await hashPassword(newPw);
                STATE_STORE.currentRoomPasswordPlain = newPw;
                document.getElementById('setting-new-password').value = "";
            }

            await FIREBASE_SERVICE.patchRoom(updates);
            showToast(newPw ? "設定と新しいあいことばを保存したよ🔑✨" : "設定を保存したよ✨");
            switchTab('home');
        };

        window.switchTab = function(tabName) {
            const tabs = ['home', 'question', 'calendar', 'settings'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tabName);
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabName) {
                    btn.classList.add('text-accent', 'bg-peach/40');
                    btn.classList.remove('text-choco-light');
                } else {
                    btn.classList.remove('text-accent', 'bg-peach/40');
                    btn.classList.add('text-choco-light');
                }
            });
            document.getElementById('main-scroll').scrollTop = 0;
            if (tabName === 'calendar') renderCalendarTab();
            if (tabName === 'question') renderQuestionTab();
            if (tabName === 'settings') renderSettingsAndAlbumTab();
        };

        const PET_QUOTES = [
            "えへへ、くすぐったい〜！💕",
            "ふたりのこと大好きだよっ！✨",
            "今日もなかよしだね〜🐣",
            "なでなで最高〜！もっと！🥰",
            "着せ替えテーマも試してみてね🎨"
        ];

        window.petTheCharacter = async function(event) {
            const charEl = document.getElementById('pet-character');
            charEl.classList.remove('animate-squish');
            void charEl.offsetWidth;
            charEl.classList.add('animate-squish');

            document.getElementById('pet-speech').textContent = PET_QUOTES[Math.floor(Math.random() * PET_QUOTES.length)];

            const stage = document.getElementById('pet-stage-area');
            const rect = stage.getBoundingClientRect();
            const x = event ? (event.clientX - rect.left) : rect.width / 2;
            const y = event ? (event.clientY - rect.top) : rect.height / 2;

            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.className = 'floating-heart text-lg';
                heart.textContent = ['💕', '💖', '✨'][i % 3];
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                heart.style.setProperty('--tx', `${(Math.random() - 0.5) * 60}px`);
                stage.appendChild(heart);
                setTimeout(() => heart.remove(), 1100);
            }

            let newAffection = STATE_STORE.roomData.affection + 2;
            let newLevel = STATE_STORE.roomData.level;
            if (newAffection >= 100) {
                newAffection -= 100;
                newLevel += 1;
                showToast(`🎉 ${STATE_STORE.roomData.petName}が Lv.${newLevel} に成長したよ！`);
            }
            await FIREBASE_SERVICE.patchRoom({ affection: newAffection, level: newLevel });
        };

        window.openMoodModal = function(target) {
            STATE_STORE.activeMoodTarget = target;
            const who = target === 'me' ? getMyName() : getPartnerName();
            document.getElementById('mood-modal-title').textContent = `${who}の今の気分は？`;

            const grid = document.getElementById('mood-options-grid');
            grid.innerHTML = MOOD_OPTIONS.map(m => `
                <button onclick="selectMood('${m.emoji}', '${m.text}')" class="bg-white hover:bg-peach/40 border border-latte rounded-2xl p-3 flex flex-col items-center gap-1 active:scale-95 transition">
                    <span class="text-2xl">${m.emoji}</span>
                    <span class="text-xs font-bold text-choco">${m.text}</span>
                </button>
            `).join('');

            document.getElementById('mood-modal').classList.remove('hidden');
        };

        window.selectMood = async function(emoji, text) {
            const targetRole = STATE_STORE.activeMoodTarget === 'me' ? STATE_STORE.myRole : (STATE_STORE.myRole === 'A' ? 'B' : 'A');
            const field = targetRole === 'A' ? 'moodA' : 'moodB';
            closeModal('mood-modal');
            await FIREBASE_SERVICE.patchRoom({ [field]: { emoji, text } });
            showToast(`気分を「${emoji} ${text}」に更新したよ！`);
        };

        window.openMemoModal = function() {
            document.getElementById('memo-input').value = '';
            document.getElementById('memo-modal').classList.remove('hidden');
        };

        window.addMemo = async function() {
            const text = document.getElementById('memo-input').value.trim();
            if (!text) {
                showToast("メモの内容を入力してね！");
                return;
            }
            const colors = ["bg-[#FFF3CD]", "bg-[#FFE5EC]", "bg-[#E2ECE9]", "bg-[#FDE2E4]"];
            const currentMemos = STATE_STORE.roomData.memos;
            const newMemo = {
                id: Date.now(),
                authorRole: STATE_STORE.myRole,
                text,
                color: colors[currentMemos.length % colors.length]
            };
            closeModal('memo-modal');
            await FIREBASE_SERVICE.patchRoom({ memos: [newMemo, ...currentMemos] });
            showToast("ミニメモをボードに貼ったよ📌");
        };

        window.deleteMemo = async function(id) {
            const filtered = STATE_STORE.roomData.memos.filter(m => m.id !== id);
            await FIREBASE_SERVICE.patchRoom({ memos: filtered });
        };

        window.closeModal = function(id) {
            document.getElementById(id).classList.add('hidden');
        };

        window.copyRoomInfo = function() {
            const pwPart = STATE_STORE.currentRoomPasswordPlain ? `\nあいことば: ${STATE_STORE.currentRoomPasswordPlain}` : "";
            const shareText = `【ふたりのおうち】\nルーム名: ${STATE_STORE.currentRoomId}${pwPart}`;
            const temp = document.createElement('textarea');
            temp.value = shareText;
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand('copy');
                showToast(`ルーム情報をコピーしたよ📋`);
            } catch (e) {
                showToast(`ルーム名: ${STATE_STORE.currentRoomId}`);
            }
            document.body.removeChild(temp);
        };

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-[#5C4738] text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 translate-y-2 text-center";
            toast.textContent = message;
            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初期バージョンバッジ反映
        document.getElementById('login-version-badge').textContent = APP_CONFIG.version;
    </script>
</body>
</html>
