<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ふたりのおうち - カップル育成＆質問アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease;
    }
    @keyframes floatPet {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-7px) scale(1.02); }
    }
    @keyframes squishPet {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.18, 0.84); }
      60% { transform: scale(0.92, 1.1); }
      100% { transform: scale(1, 1); }
    }
    @keyframes popHeart {
      0% { opacity: 1; transform: translateY(0) scale(0.6); }
      100% { opacity: 0; transform: translateY(-55px) scale(1.3); }
    }
    .pet-float {
      animation: floatPet 3.2s ease-in-out infinite;
    }
    .pet-squish {
      animation: squishPet 0.42s ease-out;
    }
    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: popHeart 0.9s ease-out forwards;
      font-size: 1.4rem;
      z-index: 30;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#FDF8F2] text-[#4A3B32] min-h-screen flex justify-center">
  <div id="app" class="w-full max-w-md min-h-screen flex flex-col relative shadow-xl bg-[#FDF8F2] overflow-x-hidden">
    <!-- Loading Screen -->
    <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center">
      <div class="text-5xl mb-4 animate-bounce">🥚</div>
      <p class="font-bold text-lg text-[#6B5446]">ふたりのおうちを準備中...</p>
      <p class="text-xs text-[#9C8475] mt-2">通信環境を確認しています</p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ==========================================
    // 1. アプリ設定・定数・テーマ定義
    // ==========================================
    const APP_VERSION = "v1.2.1";
    const THEMES = {
      cream: {
        name: "ウォームクリーム",
        bg: "#FDF8F2",
        card: "#FFFFFF",
        primary: "#FF8B7B",
        primaryDark: "#E86F5E",
        accent: "#FFF0EB",
        text: "#4A3B32",
        subtext: "#8C7568",
        border: "#F0E4D7"
      },
      sakura: {
        name: "さくらピンク",
        bg: "#FFF5F7",
        card: "#FFFFFF",
        primary: "#F472B6",
        primaryDark: "#DB2777",
        accent: "#FCE7F3",
        text: "#4A2C3A",
        subtext: "#8F6579",
        border: "#FBCFE8"
      },
      mint: {
        name: "ミントパステル",
        bg: "#F2FBF8",
        card: "#FFFFFF",
        primary: "#34D399",
        primaryDark: "#059669",
        accent: "#D1FAE5",
        text: "#234238",
        subtext: "#5C8275",
        border: "#A7F3D0"
      },
      lavender: {
        name: "ラベンダーナイト",
        bg: "#F6F4FF",
        card: "#FFFFFF",
        primary: "#8B5CF6",
        primaryDark: "#6D28D9",
        accent: "#EDE9FE",
        text: "#33294D",
        subtext: "#6E618F",
        border: "#DDD6FE"
      }
    };

    const MOODS = [
      { emoji: "🥰", label: "だいすき" },
      { emoji: "😊", label: "ごきげん" },
      { emoji: "😴", label: "ねむい" },
      { emoji: "🥺", label: "あいたい" },
      { emoji: "💪", label: "がんばる" },
      { emoji: "🍽️", label: "おなかすいた" }
    ];

    const QUESTIONS = [
      "初めて会ったときの第一印象、今でも覚えてる？",
      "ふたりでこれから一番行ってみたい旅行先はどこ？",
      "相手の「ここが実はすごく好き！」と思う小さな癖は？",
      "休日の理想の過ごし方を1つ挙げるなら？",
      "最近「ありがとう」と伝えたいと思った瞬間は？",
      "ふたりで一緒に挑戦してみたい趣味や体験はある？",
      "相手を動物やキャラクターに例えるなら何？",
      "今までで一番笑ったふたりの思い出は？",
      "落ち込んでいるとき、相手にしてもらうと嬉しいことは？",
      "10年後のふたりはどんな風に過ごしていると思う？",
      "相手の手料理や一緒に食べたいご飯で一番好きなものは？",
      "デートの待ち合わせ、実はいつもどんな気持ちで待ってる？",
      "ふたりだけの「マイルール」を作るなら何にする？",
      "季節のイベント（春・夏・秋・冬）で一番一緒に楽しみたいのは？",
      "言葉にしなくても「今こう思ってるな」と分かる瞬間は？",
      "次に記念日をお祝いするとき、どんな風に過ごしたい？",
      "相手からもらった言葉やメッセージで宝物にしているものは？",
      "朝起きて一番最初に相手に言いたい一言は？",
      "ふたりでお揃いにしたいアイテムはある？",
      "今日1日を100点満点で採点すると何点？その理由は？",
      "もし1日だけ入れ替わったら、まず何をしてみたい？",
      "相手と一緒にいるとき、自分が一番リラックスできる瞬間は？",
      "今までに行ったデートスポットで「また行きたい！」と思う場所は？",
      "相手の尊敬しているところを1つ教えて！",
      "雨の日にふたりでおうちデートをするなら何をする？",
      "相手が眠そうにしているときの可愛いエピソードは？",
      "ふたりでタイムカプセルを埋めるなら何を入れる？",
      "最近見つけた「相手に教えたくなったこと」は？",
      "今すぐ相手にハグかハイタッチをするならどっち？",
      "これからもずっと大切にしたいふたりの約束事は？"
    ];

    // ==========================================
    // 2. 状態管理 & Firebase 初期化
    // ==========================================
    let db = null;
    let auth = null;
    let appId = "futari-no-ouchi-default";
    let useLocalFallback = false;

    let state = {
      screen: "login", // login | main
      activeTab: "home", // home | question | calendar | settings
      roomId: "",
      role: "A", // A or B
      roomData: null,
      selectedDate: getTodayStr(),
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      toastMessage: ""
    };

    let unsubscribeRoom = null;

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getQuestionForDate(dateStr) {
      let hash = 0;
      for (let i = 0; i < dateStr.length; i++) {
        hash = (hash * 31 + dateStr.charCodeAt(i)) % 100000;
      }
      return QUESTIONS[hash % QUESTIONS.length];
    }

    function normalizeRoomData(raw, roomId, password) {
      const data = raw || {};
      return {
        version: APP_VERSION,
        roomId: data.roomId || roomId,
        password: data.password || password || "",
        partnerA: {
          name: data.partnerA?.name || "わたし",
          mood: data.partnerA?.mood || "🥰",
          memo: data.partnerA?.memo || "今日もよろしくね！"
        },
        partnerB: {
          name: data.partnerB?.name || "パートナー",
          mood: data.partnerB?.mood || "😊",
          memo: data.partnerB?.memo || "いつもありがとう！"
        },
        anniversary: data.anniversary || getTodayStr(),
        pet: {
          name: data.pet?.name || "もちまる",
          exp: typeof data.pet?.exp === "number" ? data.pet.exp : 10
        },
        theme: THEMES[data.theme] ? data.theme : "cream",
        answers: data.answers && typeof data.answers === "object" ? data.answers : {},
        updatedAt: data.updatedAt || Date.now()
      };
    }

    async function initApp() {
      try {
        if (typeof __firebase_config !== "undefined" && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
          if (typeof __app_id !== "undefined" && __app_id) {
            appId = __app_id;
          }
          if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } else {
          // GitHub Pages等で単体公開した際の安全フォールバック
          useLocalFallback = true;
        }
      } catch (err) {
        console.warn("Firebase fallback mode enabled:", err);
        useLocalFallback = true;
      }

      render();
    }

    // ==========================================
    // 3. データ同期・保存処理
    // ==========================================
    function getRoomDocRef(roomId) {
      const safeId = roomId.trim().replace(/[\/.#$\[\]]/g, "_");
      return doc(db, "artifacts", appId, "public", "data", "rooms", safeId);
    }

    async function enterRoom(roomIdInput, passwordInput, roleInput) {
      const roomId = roomIdInput.trim();
      const password = passwordInput.trim();
      if (!roomId || !password) {
        showToast("ルーム名とあいことばを入力してね！");
        return;
      }

      if (useLocalFallback) {
        const storageKey = `futari_room_${roomId}`;
        const savedRaw = localStorage.getItem(storageKey);
        if (savedRaw) {
          const parsed = JSON.parse(savedRaw);
          if (parsed.password && parsed.password !== password) {
            showToast("あいことばが違うみたいです！");
            return;
          }
          state.roomData = normalizeRoomData(parsed, roomId, password);
        } else {
          state.roomData = normalizeRoomData(null, roomId, password);
          localStorage.setItem(storageKey, JSON.stringify(state.roomData));
        }
        state.roomId = roomId;
        state.role = roleInput;
        state.screen = "main";
        render();
        showToast("おうちに入室しました！");
        return;
      }

      try {
        const ref = getRoomDocRef(roomId);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          const existing = snap.data();
          if (existing.password && existing.password !== password) {
            showToast("あいことばが違うみたいです！");
            return;
          }
          const normalized = normalizeRoomData(existing, roomId, password);
          state.roomData = normalized;
        } else {
          const initial = normalizeRoomData(null, roomId, password);
          await setDoc(ref, initial);
          state.roomData = initial;
        }

        state.roomId = roomId;
        state.role = roleInput;
        state.screen = "main";

        if (unsubscribeRoom) unsubscribeRoom();
        unsubscribeRoom = onSnapshot(ref, (docSnap) => {
          if (docSnap.exists()) {
            state.roomData = normalizeRoomData(docSnap.data(), roomId, password);
            render();
          }
        });

        render();
        showToast("おうちに入室しました！");
      } catch (e) {
        console.error(e);
        showToast("入室エラーが発生しました。もう一度お試しください。");
      }
    }

    async function saveRoomData(updatedData) {
      updatedData.updatedAt = Date.now();
      state.roomData = updatedData;
      render();

      if (useLocalFallback) {
        localStorage.setItem(`futari_room_${state.roomId}`, JSON.stringify(updatedData));
        return;
      }

      try {
        const ref = getRoomDocRef(state.roomId);
        await setDoc(ref, updatedData, { merge: true });
      } catch (e) {
        console.error("Save error:", e);
        showToast("保存中に通信エラーが起きました");
      }
    }

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      setTimeout(() => {
        if (state.toastMessage === msg) {
          state.toastMessage = "";
          render();
        }
      }, 2600);
    }

    // ==========================================
    // 4. アクション関数群
    // ==========================================
    window.handleLogin = (e) => {
      e.preventDefault();
      const r = document.getElementById("login-room").value;
      const p = document.getElementById("login-pass").value;
      const role = document.querySelector('input[name="login-role"]:checked').value;
      enterRoom(r, p, role);
    };

    window.switchTab = (tab) => {
      state.activeTab = tab;
      render();
    };

    window.petTap = (e) => {
      const petEl = document.getElementById("pet-avatar");
      if (petEl) {
        petEl.classList.remove("pet-squish");
        void petEl.offsetWidth;
        petEl.classList.add("pet-squish");
      }

      const container = document.getElementById("pet-stage");
      if (container) {
        const heart = document.createElement("div");
        heart.className = "heart-particle";
        heart.textContent = ["💖", "✨", "💕", "🌸"][Math.floor(Math.random() * 4)];
        heart.style.left = `${35 + Math.random() * 30}%`;
        heart.style.top = `35%`;
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 900);
      }

      const next = structuredClone(state.roomData);
      next.pet.exp += 2;
      saveRoomData(next);
    };

    window.updateMood = (emoji) => {
      const next = structuredClone(state.roomData);
      const key = state.role === "A" ? "partnerA" : "partnerB";
      next[key].mood = emoji;
      saveRoomData(next);
      showToast("気分を更新しました！");
    };

    window.updateMemo = () => {
      const input = document.getElementById("my-memo-input");
      if (!input) return;
      const val = input.value.trim();
      const next = structuredClone(state.roomData);
      const key = state.role === "A" ? "partnerA" : "partnerB";
      next[key].memo = val || "よろしくね！";
      saveRoomData(next);
      showToast("ミニメモを貼りました！");
    };

    window.submitAnswer = (dateStr) => {
      const textarea = document.getElementById("answer-textarea");
      if (!textarea) return;
      const text = textarea.value.trim();
      if (!text) {
        showToast("回答を入力してね！");
        return;
      }
      const next = structuredClone(state.roomData);
      if (!next.answers[dateStr]) {
        next.answers[dateStr] = {
          question: getQuestionForDate(dateStr),
          A: "",
          B: ""
        };
      }
      const isFirstTime = !next.answers[dateStr][state.role];
      next.answers[dateStr][state.role] = text;
      if (isFirstTime) {
        next.pet.exp += 15;
      }
      saveRoomData(next);
      showToast(isFirstTime ? "回答を保存！なかよし度+15 💖" : "回答を更新しました！");
    };

    window.selectCalendarDate = (dateStr) => {
      state.selectedDate = dateStr;
      state.activeTab = "question";
      render();
    };

    window.changeMonth = (delta) => {
      let m = state.calMonth + delta;
      let y = state.calYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      state.calMonth = m;
      state.calYear = y;
      render();
    };

    window.saveSettings = (e) => {
      e.preventDefault();
      const next = structuredClone(state.roomData);
      next.partnerA.name = document.getElementById("set-name-a").value.trim() || "わたし";
      next.partnerB.name = document.getElementById("set-name-b").value.trim() || "パートナー";
      next.anniversary = document.getElementById("set-anniv").value || getTodayStr();
      next.pet.name = document.getElementById("set-pet-name").value.trim() || "もちまる";
      const newPass = document.getElementById("set-pass").value.trim();
      if (newPass) next.password = newPass;
      saveRoomData(next);
      showToast("設定を保存しました！");
    };

    window.changeTheme = (themeKey) => {
      const next = structuredClone(state.roomData);
      next.theme = themeKey;
      saveRoomData(next);
      showToast("テーマを着せ替えました！");
    };

    window.copyRoomInfo = () => {
      const d = state.roomData;
      const text = `【ふたりのおうち】
URL: ${window.location.href}
ルーム名: ${d.roomId}
あいことば: ${d.password}`;
      navigator.clipboard?.writeText(text);
      showToast("招待情報をコピーしました！");
    };

    window.logoutRoom = () => {
      if (unsubscribeRoom) unsubscribeRoom();
      state.screen = "login";
      state.roomData = null;
      render();
    };

    // ==========================================
    // 5. 画面描画コンポーネント
    // ==========================================
    function getPetStageInfo(exp) {
      const level = Math.floor(exp / 30) + 1;
      const progress = ((exp % 30) / 30) * 100;
      if (level <= 2) {
        return { level, progress, stage: "たまご期", emoji: "🥚", desc: "ふたりの会話で温まっています" };
      } else if (level <= 5) {
        return { level, progress, stage: "ひよこ期", emoji: "🐥", desc: "元気にぴよぴよ跳ねています" };
      } else {
        return { level, progress, stage: "なかよし天使期", emoji: "👼", desc: "ふたりの愛で立派に成長しました！" };
      }
    }

    function calcDaysTogether(annivStr) {
      const start = new Date(annivStr + "T00:00:00");
      const today = new Date(getTodayStr() + "T00:00:00");
      const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      return diff >= 0 ? diff + 1 : 0;
    }

    function renderLogin(theme) {
      return `
        <div class="flex-1 flex flex-col justify-center p-6" style="background-color: ${theme.bg}; color: ${theme.text};">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full text-4xl shadow-md mb-3 pet-float" style="background-color: ${theme.card};">
              🥚
            </div>
            <h1 class="text-2xl font-extrabold tracking-wide">ふたりのおうち</h1>
            <p class="text-xs mt-1" style="color: ${theme.subtext};">毎日の質問でたまごを育てるカップル専用ルーム</p>
          </div>

          <form onsubmit="handleLogin(event)" class="rounded-3xl p-6 shadow-sm border space-y-4" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div>
              <label class="block text-xs font-bold mb-1">ルーム名（ID）</label>
              <input id="login-room" type="text" required placeholder="例：taro-hanako" class="w-full px-4 py-3 rounded-2xl border text-sm focus:outline-none" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              <p class="text-[11px] mt-1" style="color: ${theme.subtext};">※新しいルーム名なら自動で新規作成されます</p>
            </div>

            <div>
              <label class="block text-xs font-bold mb-1">あいことば（パスワード）</label>
              <input id="login-pass" type="text" required placeholder="ふたりだけの秘密の言葉" class="w-full px-4 py-3 rounded-2xl border text-sm focus:outline-none" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
            </div>

            <div>
              <label class="block text-xs font-bold mb-1.5">あなたはどっち？</label>
              <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                  <input type="radio" name="login-role" value="A" checked class="peer sr-only" />
                  <div class="py-2.5 px-3 rounded-2xl border text-center text-sm font-bold peer-checked:text-white transition" style="border-color: ${theme.border};" data-active-bg="${theme.primary}">
                    パートナー A
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="login-role" value="B" class="peer sr-only" />
                  <div class="py-2.5 px-3 rounded-2xl border text-center text-sm font-bold peer-checked:text-white transition" style="border-color: ${theme.border};">
                    パートナー B
                  </div>
                </label>
              </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl text-white font-bold text-sm shadow-md active:scale-95 transition" style="background-color: ${theme.primary};">
              おうちに入る 🏡
            </button>
          </form>

          <style>
            input[name="login-role"]:checked + div {
              background-color: ${theme.primary} !important;
              border-color: ${theme.primary} !important;
              color: #FFFFFF !important;
            }
          </style>
        </div>
      `;
    }

    function renderHome(d, theme) {
      const petInfo = getPetStageInfo(d.pet.exp);
      const days = calcDaysTogether(d.anniversary);
      const me = state.role === "A" ? d.partnerA : d.partnerB;
      const partner = state.role === "A" ? d.partnerB : d.partnerA;
      const todayStr = getTodayStr();
      const todayAns = d.answers[todayStr] || {};
      const answeredCount = (todayAns.A ? 1 : 0) + (todayAns.B ? 1 : 0);

      return `
        <div class="p-4 space-y-4 pb-24">
          <!-- 記念日バナー -->
          <div class="rounded-3xl p-4 shadow-sm border flex items-center justify-between" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div>
              <p class="text-xs font-bold" style="color: ${theme.subtext};">${d.partnerA.name} 💕 ${d.partnerB.name}</p>
              <p class="text-xl font-extrabold mt-0.5">一緒になって <span style="color: ${theme.primary};">${days}</span> 日目</p>
            </div>
            <div class="text-right">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-bold" style="background-color: ${theme.accent}; color: ${theme.primaryDark};">
                🎂 ${d.anniversary}
              </span>
            </div>
          </div>

          <!-- ペット育成ステージ -->
          <div id="pet-stage" class="relative rounded-3xl p-6 shadow-sm border text-center overflow-hidden" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="flex justify-between items-center text-xs font-bold mb-2">
              <span class="px-3 py-1 rounded-full" style="background-color: ${theme.accent}; color: ${theme.primaryDark};">Lv.${petInfo.level} ${petInfo.stage}</span>
              <span style="color: ${theme.subtext};">タップでなでなで 💕</span>
            </div>

            <div onclick="petTap(event)" class="my-4 inline-block cursor-pointer select-none">
              <div id="pet-avatar" class="text-7xl pet-float drop-shadow-sm">${petInfo.emoji}</div>
            </div>

            <h2 class="text-lg font-extrabold">${d.pet.name}</h2>
            <p class="text-xs mt-0.5" style="color: ${theme.subtext};">${petInfo.desc}</p>

            <div class="mt-4">
              <div class="flex justify-between text-[11px] font-bold mb-1" style="color: ${theme.subtext};">
                <span>なかよし度</span>
                <span>EXP ${d.pet.exp}</span>
              </div>
              <div class="w-full h-2.5 rounded-full overflow-hidden" style="background-color: ${theme.bg};">
                <div class="h-full rounded-full transition-all duration-300" style="width: ${petInfo.progress}%; background-color: ${theme.primary};"></div>
              </div>
            </div>
          </div>

          <!-- 今日の質問ショートカット -->
          <div onclick="switchTab('question')" class="cursor-pointer rounded-3xl p-4 shadow-sm border flex items-center justify-between active:scale-98 transition" style="background-color: ${theme.accent}; border-color: ${theme.border};">
            <div class="pr-3">
              <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-white" style="color: ${theme.primaryDark};">今日の質問 (${answeredCount}/2 回答済)</span>
              <p class="text-sm font-bold mt-1.5 line-clamp-1">${getQuestionForDate(todayStr)}</p>
            </div>
            <div class="text-2xl">💌</div>
          </div>

          <!-- ふたりの気分＆ミニメモ -->
          <div class="rounded-3xl p-4 shadow-sm border space-y-4" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <h3 class="text-sm font-extrabold">今の気分＆ミニメモボード</h3>

            <div class="grid grid-cols-2 gap-3">
              <!-- 自分 -->
              <div class="p-3 rounded-2xl border" style="background-color: ${theme.bg}; border-color: ${theme.border};">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold">${me.name} (自分)</span>
                  <span class="text-2xl">${me.mood}</span>
                </div>
                <p class="text-xs break-words min-h-[2.5rem]" style="color: ${theme.subtext};">「${me.memo}」</p>
              </div>

              <!-- パートナー -->
              <div class="p-3 rounded-2xl border" style="background-color: ${theme.bg}; border-color: ${theme.border};">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold">${partner.name}</span>
                  <span class="text-2xl">${partner.mood}</span>
                </div>
                <p class="text-xs break-words min-h-[2.5rem]" style="color: ${theme.subtext};">「${partner.memo}」</p>
              </div>
            </div>

            <!-- 気分変更ボタン -->
            <div>
              <p class="text-[11px] font-bold mb-1.5" style="color: ${theme.subtext};">今の気分をタップして変更：</p>
              <div class="grid grid-cols-6 gap-1.5">
                ${MOODS.map(m => `
                  <button onclick="updateMood('${m.emoji}')" class="py-2 rounded-xl border text-lg flex flex-col items-center justify-center transition ${me.mood === m.emoji ? 'ring-2' : ''}" style="background-color: ${me.mood === m.emoji ? theme.accent : theme.bg}; border-color: ${theme.border};">
                    <span>${m.emoji}</span>
                  </button>
                `).join("")}
              </div>
            </div>

            <!-- メモ入力 -->
            <div class="flex gap-2">
              <input id="my-memo-input" type="text" maxlength="40" value="${me.memo}" placeholder="ひとことメモを残す..." class="flex-1 px-3 py-2 rounded-xl border text-xs focus:outline-none" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              <button onclick="updateMemo()" class="px-4 py-2 rounded-xl text-white text-xs font-bold shrink-0" style="background-color: ${theme.primary};">貼る</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuestion(d, theme) {
      const targetDate = state.selectedDate || getTodayStr();
      const isToday = targetDate === getTodayStr();
      const qText = (d.answers[targetDate] && d.answers[targetDate].question) || getQuestionForDate(targetDate);
      const ansObj = d.answers[targetDate] || { A: "", B: "" };

      const myRole = state.role;
      const partnerRole = myRole === "A" ? "B" : "A";
      const myName = d[`partner${myRole}`].name;
      const partnerName = d[`partner${partnerRole}`].name;

      const myAns = ansObj[myRole] || "";
      const partnerAns = ansObj[partnerRole] || "";
      const isUnlocked = Boolean(myAns);

      return `
        <div class="p-4 space-y-4 pb-24">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold px-3 py-1 rounded-full" style="background-color: ${theme.accent}; color: ${theme.primaryDark};">
              ${isToday ? "✨ 今日の質問" : "🕰️ 過去の質問"} (${targetDate})
            </span>
            ${!isToday ? `<button onclick="selectCalendarDate('${getTodayStr()}')" class="text-xs font-bold underline" style="color: ${theme.primary};">今日に戻る</button>` : ""}
          </div>

          <!-- 質問カード -->
          <div class="rounded-3xl p-6 shadow-sm border text-center" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="text-3xl mb-2">💌</div>
            <h2 class="text-base font-extrabold leading-relaxed">${qText}</h2>
          </div>

          <!-- 自分の回答フォーム -->
          <div class="rounded-3xl p-5 shadow-sm border space-y-3" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold">${myName} の回答</span>
              <span class="text-[11px] font-bold" style="color: ${myAns ? theme.primaryDark : theme.subtext};">${myAns ? "回答済み ✓" : "未回答"}</span>
            </div>
            <textarea id="answer-textarea" rows="3" placeholder="ここにあなたの気持ちや答えを書いてね..." class="w-full p-3 rounded-2xl border text-sm focus:outline-none" style="border-color: ${theme.border}; background-color: ${theme.bg};">${myAns}</textarea>
            <button onclick="submitAnswer('${targetDate}')" class="w-full py-3 rounded-2xl text-white font-bold text-sm shadow-sm active:scale-95 transition" style="background-color: ${theme.primary};">
              ${myAns ? "回答を更新する" : "回答を送信してロック解除 🔓"}
            </button>
          </div>

          <!-- パートナーの回答カード（ロックギミック付き） -->
          <div class="rounded-3xl p-5 shadow-sm border" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-extrabold">${partnerName} の回答</span>
              <span class="text-[11px] font-bold" style="color: ${partnerAns ? theme.primaryDark : theme.subtext};">${partnerAns ? "入力済み" : "まだ入力されていません"}</span>
            </div>

            ${!partnerAns ? `
              <div class="p-4 rounded-2xl text-center text-xs" style="background-color: ${theme.bg}; color: ${theme.subtext};">
                ${partnerName} の回答待ちです ⏳
              </div>
            ` : isUnlocked ? `
              <div class="p-4 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap" style="background-color: ${theme.accent};">
                ${partnerAns}
              </div>
            ` : `
              <div class="p-5 rounded-2xl text-center space-y-1 border border-dashed" style="background-color: ${theme.bg}; border-color: ${theme.primary};">
                <div class="text-2xl">🔒</div>
                <p class="text-xs font-extrabold">${partnerName} の回答が届いています！</p>
                <p class="text-[11px]" style="color: ${theme.subtext};">あなたが回答を送信すると中身が見られるようになります</p>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderCalendar(d, theme) {
      const y = state.calYear;
      const m = state.calMonth;
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const todayStr = getTodayStr();
      const annivMD = d.anniversary ? d.anniversary.slice(5) : "";

      let cells = "";
      for (let i = 0; i < firstDay; i++) {
        cells += `<div class="h-14"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const ans = d.answers[dateStr];
        const hasA = ans && ans.A;
        const hasB = ans && ans.B;
        const isAnniv = annivMD && dateStr.slice(5) === annivMD;
        const isToday = dateStr === todayStr;

        let badge = "";
        if (isAnniv) badge = "🎂";
        else if (hasA && hasB) badge = "💖";
        else if (hasA || hasB) badge = "⭐";

        cells += `
          <button onclick="selectCalendarDate('${dateStr}')" class="h-14 rounded-2xl border flex flex-col items-center justify-center relative transition active:scale-95" style="background-color: ${isToday ? theme.accent : theme.card}; border-color: ${isToday ? theme.primary : theme.border};">
            <span class="text-xs font-bold">${day}</span>
            <span class="text-xs h-4 leading-4 mt-0.5">${badge}</span>
          </button>
        `;
      }

      return `
        <div class="p-4 space-y-4 pb-24">
          <div class="rounded-3xl p-4 shadow-sm border" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="flex items-center justify-between mb-4">
              <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-full border font-bold" style="border-color: ${theme.border};">◀</button>
              <h2 class="text-base font-extrabold">${y}年 ${m + 1}月</h2>
              <button onclick="changeMonth(1)" class="w-9 h-9 rounded-full border font-bold" style="border-color: ${theme.border};">▶</button>
            </div>

            <div class="grid grid-cols-7 text-center text-[11px] font-bold mb-2" style="color: ${theme.subtext};">
              <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>
            </div>

            <div class="grid grid-cols-7 gap-1.5">
              ${cells}
            </div>

            <div class="mt-4 pt-3 border-t flex justify-around text-[11px] font-bold" style="border-color: ${theme.border}; color: ${theme.subtext};">
              <span>💖 ふたり回答済</span>
              <span>⭐ 片方回答済</span>
              <span>🎂 記念日</span>
            </div>
          </div>
          <p class="text-center text-xs" style="color: ${theme.subtext};">日付をタップするとその日の質問にさかのぼって回答・閲覧できます</p>
        </div>
      `;
    }

    function renderSettings(d, theme) {
      const answeredDates = Object.keys(d.answers).sort().reverse();

      return `
        <div class="p-4 space-y-4 pb-24">
          <!-- テーマ着せ替え -->
          <div class="rounded-3xl p-5 shadow-sm border space-y-3" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <h3 class="text-sm font-extrabold">🎨 お部屋の着せ替えテーマ</h3>
            <div class="grid grid-cols-2 gap-2.5">
              ${Object.entries(THEMES).map(([key, t]) => `
                <button onclick="changeTheme('${key}')" class="p-3 rounded-2xl border text-left flex items-center gap-2.5 transition" style="background-color: ${t.bg}; border-color: ${d.theme === key ? t.primary : t.border}; border-width: ${d.theme === key ? '2px' : '1px'};">
                  <span class="w-5 h-5 rounded-full shrink-0" style="background-color: ${t.primary};"></span>
                  <span class="text-xs font-bold" style="color: ${t.text};">${t.name}</span>
                </button>
              `).join("")}
            </div>
          </div>

          <!-- ルーム・プロフィール設定 -->
          <form onsubmit="saveSettings(event)" class="rounded-3xl p-5 shadow-sm border space-y-3" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold">⚙️ ふたりとペットの設定</h3>
              <button type="button" onclick="copyRoomInfo()" class="text-xs font-bold px-3 py-1 rounded-full" style="background-color: ${theme.accent}; color: ${theme.primaryDark};">招待コピー 📋</button>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold mb-1">パートナーA 名前</label>
                <input id="set-name-a" type="text" value="${d.partnerA.name}" class="w-full px-3 py-2 rounded-xl border text-xs" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              </div>
              <div>
                <label class="block text-[11px] font-bold mb-1">パートナーB 名前</label>
                <input id="set-name-b" type="text" value="${d.partnerB.name}" class="w-full px-3 py-2 rounded-xl border text-xs" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold mb-1">ふたりの記念日</label>
                <input id="set-anniv" type="date" value="${d.anniversary}" class="w-full px-3 py-2 rounded-xl border text-xs" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              </div>
              <div>
                <label class="block text-[11px] font-bold mb-1">ペットの名前</label>
                <input id="set-pet-name" type="text" value="${d.pet.name}" class="w-full px-3 py-2 rounded-xl border text-xs" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold mb-1">あいことば（パスワード変更）</label>
              <input id="set-pass" type="text" value="${d.password}" class="w-full px-3 py-2 rounded-xl border text-xs" style="border-color: ${theme.border}; background-color: ${theme.bg};" />
            </div>

            <button type="submit" class="w-full py-2.5 rounded-2xl text-white font-bold text-xs" style="background-color: ${theme.primary};">設定を保存する</button>
          </form>

          <!-- 思い出アルバム一覧 -->
          <div class="rounded-3xl p-5 shadow-sm border space-y-3" style="background-color: ${theme.card}; border-color: ${theme.border};">
            <h3 class="text-sm font-extrabold">📖 思い出アルバム (${answeredDates.length}件)</h3>
            ${answeredDates.length === 0 ? `
              <p class="text-xs text-center py-4" style="color: ${theme.subtext};">まだ回答した質問がありません</p>
            ` : `
              <div class="space-y-3 max-h-72 overflow-y-auto no-scrollbar">
                ${answeredDates.map(dt => {
                  const item = d.answers[dt];
                  const unlocked = Boolean(item.A && item.B);
                  return `
                    <div onclick="selectCalendarDate('${dt}')" class="p-3 rounded-2xl border cursor-pointer" style="background-color: ${theme.bg}; border-color: ${theme.border};">
                      <div class="flex justify-between text-[11px] font-bold mb-1" style="color: ${theme.subtext};">
                        <span>${dt}</span>
                        <span>${unlocked ? "💖 両方回答済" : "🔒 片方のみ回答"}</span>
                      </div>
                      <p class="text-xs font-extrabold mb-1.5">${item.question}</p>
                      ${unlocked ? `
                        <p class="text-[11px]"><b>${d.partnerA.name}:</b> ${item.A}</p>
                        <p class="text-[11px]"><b>${d.partnerB.name}:</b> ${item.B}</p>
                      ` : `<p class="text-[11px]" style="color: ${theme.primaryDark};">タップして回答するとロック解除されます</p>`}
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>

          <!-- バージョン・ログアウト -->
          <div class="text-center space-y-2 pt-2">
            <p class="text-[11px]" style="color: ${theme.subtext};">ふたりのおうち ${APP_VERSION}（アップデート対応版）</p>
            <button onclick="logoutRoom()" class="text-xs font-bold underline" style="color: ${theme.subtext};">別のルームに入り直す（ログアウト）</button>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      const theme = (state.roomData && THEMES[state.roomData.theme]) || THEMES.cream;
      document.body.style.backgroundColor = theme.bg;
      root.style.backgroundColor = theme.bg;
      root.style.color = theme.text;

      if (state.screen === "login" || !state.roomData) {
        root.innerHTML = renderLogin(theme) + renderToast(theme);
        return;
      }

      const d = state.roomData;
      let bodyHtml = "";
      if (state.activeTab === "home") bodyHtml = renderHome(d, theme);
      else if (state.activeTab === "question") bodyHtml = renderQuestion(d, theme);
      else if (state.activeTab === "calendar") bodyHtml = renderCalendar(d, theme);
      else if (state.activeTab === "settings") bodyHtml = renderSettings(d, theme);

      root.innerHTML = `
        <!-- Header -->
        <header class="sticky top-0 z-20 px-4 py-3 border-b flex items-center justify-between backdrop-blur-md" style="background-color: ${theme.card}EE; border-color: ${theme.border};">
          <div class="flex items-center gap-2">
            <span class="text-lg">🏡</span>
            <div>
              <h1 class="text-sm font-extrabold leading-tight">ふたりのおうち</h1>
              <p class="text-[10px]" style="color: ${theme.subtext};">Room: ${d.roomId}</p>
            </div>
          </div>
          <button onclick="copyRoomInfo()" class="text-[11px] font-bold px-2.5 py-1 rounded-full border" style="background-color: ${theme.bg}; border-color: ${theme.border};">
            ルーム共有 🔗
          </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1">
          ${bodyHtml}
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 w-full max-w-md border-t grid grid-cols-4 py-2 z-20" style="background-color: ${theme.card}; border-color: ${theme.border};">
          ${[
            { id: "home", icon: "🏡", label: "おうち" },
            { id: "question", icon: "💌", label: "今日の質問" },
            { id: "calendar", icon: "📅", label: "カレンダー" },
            { id: "settings", icon: "📖", label: "設定・記録" }
          ].map(tab => `
            <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center py-1 transition" style="color: ${state.activeTab === tab.id ? theme.primary : theme.subtext};">
              <span class="text-lg">${tab.icon}</span>
              <span class="text-[10px] font-bold mt-0.5">${tab.label}</span>
            </button>
          `).join("")}
        </nav>

        ${renderToast(theme)}
      `;
    }

    function renderToast(theme) {
      if (!state.toastMessage) return "";
      return `
        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-lg text-xs font-bold text-white whitespace-nowrap" style="background-color: ${theme.text};">
          ${state.toastMessage}
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
